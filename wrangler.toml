# Cloudflare Pages 项目配置。
#
# 这是纯静态站点，没有 Functions，所以只有三行关键配置：
#   name                     → Cloudflare Pages 项目名
#   pages_build_output_dir   → 上传哪个目录（webpack 产物）
#   compatibility_date       → 只是让 wrangler 不报警告，静态站用不到#
# 构建期由 Cloudflare 自己的构建机执行（Git 集成，push 即部署）：
#   [build] command 是给 CF 构建机看的；Dashboard 里的 build command 会被
#   wrangler.toml 覆盖（实测：文件存在但没写 command 时，构建机直接
#   "No build command specified. Skipping build step." 然后抱怨产物目录不存在）。
[build]
command = "npm run build"

# 本机构建 + 直投（Git 集成挂了/需要立即上线时用）：
#
#   CLOUDFLARE_API_TOKEN=... CLOUDFLARE_ACCOUNT_ID=... npm run deploy
#
# ⚠️ account_id 不能写进这个文件：Pages 的配置校验会直接报
#    "Configuration file for Pages projects does not support account_id"，
#    只能用 CLOUDFLARE_ACCOUNT_ID 环境变量传。
#
# 构建期的 SITE_URL / GA4_ID 默认值已经写在 webpack/site.js
# （https://kittyjump.online / G-Z6ZM31GBVV），一般不用再传。
# 想给预览环境关掉统计：GA4_ID= npm run build
name = "kittyjump"
pages_build_output_dir = "./build"
compatibility_date = "2026-10-05"
