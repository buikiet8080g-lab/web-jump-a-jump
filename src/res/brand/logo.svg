<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- 圆角方形底：蜜桃粉 -> 树莓红，和「Play Again」按钮同一套渐变 -->
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9b0a4"/>
      <stop offset="1" stop-color="#ee5568"/>
    </linearGradient>
    <!-- 左上角一点柔光，避免底色太平 -->
    <radialGradient id="gloss" cx="0.28" cy="0.18" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#badge)"/>
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#gloss)"/>

  <!-- 猫的正脸。
       旧版是一只站立的猫剪影 + 方块，比例照着游戏里的 LITTLE_MAN 来；
       问题是缩到头部导航的 28px（更别说标签页 16px）只剩一团白影，
       和「文件图标」「自动售货机」根本分不清。

       换成正脸是因为小尺寸下只剩两个能用的识别信号：**耳朵** 和 **眼睛**。
       侧身/全身剪影在这两个尺寸上都会糊成一条，正脸还能读出是猫。

       耳朵必须**破出头部圆的轮廓**才看得见：同色剪影里，被包在轮廓内的
       东西等于不存在。所以耳尖要明显高过头顶（这里尖到 y=6.2，头顶在 13.5）。 -->
  <g fill="#fffaf5">
    <path d="M20.2 23.4 L17.2 6.2 L27.4 15.0 Z"/>
    <path d="M43.8 23.4 L46.8 6.2 L36.6 15.0 Z"/>
    <circle cx="32" cy="27" r="13.5"/>
  </g>

  <!-- 五官：颜色全部取自主题里的树莓红系（#ee5568 主色 / #f0838f 浅一档），
       不用纯黑或灰，避免在粉色底上显得脏 -->
  <g fill="#ee5568">
    <ellipse cx="26.4" cy="26.2" rx="2.4" ry="3.0"/>
    <ellipse cx="37.6" cy="26.2" rx="2.4" ry="3.0"/>
  </g>

  <!-- 鼻子 + 嘴：一个倒三角加一个 w，是「猫脸」约定俗成的画法 -->
  <path d="M30.3 32.0 L33.7 32.0 L32 34.2 Z" fill="#f0838f"/>
  <g fill="none" stroke="#f0838f" stroke-width="1.1" stroke-linecap="round">
    <path d="M32 34.2 q-1.8 2.2 -3.5 0.5"/>
    <path d="M32 34.2 q1.8 2.2 3.5 0.5"/>
  </g>

  <!-- 胡须画在脸的轮廓**以内**：伸到粉色底上就看不见了（同色） -->
  <g fill="none" stroke="#f7a3ae" stroke-width="1.1" stroke-linecap="round">
    <path d="M24.4 30.4 L19.2 29.2"/>
    <path d="M24.4 33.1 L19.4 33.9"/>
    <path d="M39.6 30.4 L44.8 29.2"/>
    <path d="M39.6 33.1 L44.6 33.9"/>
  </g>

  <!-- 方块 + 爪印：保住「跳一跳」的方块元素（猫踩在方块上）。
       这两样在 28px 以下会糊掉，但不碍事 —— 上面那张脸已经足够认人。 -->
  <rect x="16" y="43" width="32" height="13" rx="4.5" fill="#ffe7d6"/>
  <g fill="#f0838f">
    <ellipse cx="32" cy="49.8" rx="2.5" ry="2.0"/>
    <circle cx="28.6" cy="47.1" r="0.95"/>
    <circle cx="30.9" cy="46.3" r="0.95"/>
    <circle cx="33.4" cy="46.3" r="0.95"/>
    <circle cx="35.7" cy="47.1" r="0.95"/>
  </g>
</svg>
