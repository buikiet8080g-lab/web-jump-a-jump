<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- 圆角方形底：蜜桃粉 -> 树莓红，和「Play Again」按钮同一套渐变 -->
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9b0a4"/>
      <stop offset="1" stop-color="#ee5568"/>
    </linearGradient>
    <!-- 左上角一点柔光，避免底色太平 -->
    <radialGradient id="gloss" cx="0.28" cy="0.18" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#badge)"/>
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#gloss)"/>

  <!-- 猫（跳跃中）：奶白色剪影，和游戏里是同一个造型。
       比例照着 LITTLE_MAN_WIDTH : LITTLE_MAN_HEIGHT ≈ 1 : 3.5。

       整体下移 1.9，给耳朵腾出空间 —— 耳朵必须**破出头部圆的轮廓**才看得见：
       卡通角色只靠剪影辨认，同色的东西一旦被包在轮廓里（比如耳朵整个藏在
       头后面）就等于不存在。所以耳尖要明显高过头顶。 -->
  <g transform="translate(0,1.9)" fill="#fffaf5">
    <!-- 头 -->
    <circle cx="32" cy="13.4" r="5.1"/>
    <!-- 两只耳朵：往外张开的三角，耳尖高过头顶 2.1 -->
    <path d="M27.0 12.9 L28.2 6.2 L32.4 10.6 Z"/>
    <path d="M37.0 12.9 L35.8 6.2 L31.6 10.6 Z"/>
    <!-- 身子：上窄下宽的锥形，顶端嵌在头部圆内，连成一体不会脱节 -->
    <path d="M28.6 15 h6.8 q1.4 0 1.7 1.4 l2.0 13.4 q0.7 4.7 -4.2 4.7 h-5.8 q-4.9 0 -4.2 -4.7 l2.0 -13.4 q0.3 -1.4 1.7 -1.4 z"/>
  </g>

  <!-- 方块 -->
  <rect x="17.5" y="42" width="29" height="13.5" rx="4.5" fill="#ffe7d6"/>

  <!-- 方块上的爪印：给「猫」再加一道识别信号，不然缩到 32px 只剩一团白影 -->
  <g fill="#f0838f">
    <ellipse cx="32" cy="49.6" rx="2.5" ry="2.0"/>
    <circle cx="28.6" cy="46.9" r="0.95"/>
    <circle cx="30.9" cy="46.1" r="0.95"/>
    <circle cx="33.4" cy="46.1" r="0.95"/>
    <circle cx="35.7" cy="46.9" r="0.95"/>
  </g>
</svg>
