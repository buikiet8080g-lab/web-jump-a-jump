# 构建静态站点并发布到 GitHub Pages
#
# 为什么用 Actions 而不是把 build/ 提交进仓库：
#   产物里有 contenthash 文件名，每次构建都会新增一批文件、旧的一直留着，
#   仓库会越滚越大，而且 review diff 全是哈希文件名。构建产物不应该进版本管理。
#
# ⚠️ 首次使用需要手动开一次：
#   仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
#
# 如果之后改用 Cloudflare Pages，这个文件可以删掉 —— 那边在控制台里
# 填「构建命令 npm run build、输出目录 build」即可，不需要 Actions。

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送不等旧的跑完，直接取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # 老 lockfile 有问题时退回 npm install，别让部署卡在依赖上
        run: npm ci || npm install

      - name: Run tests
        run: npm test

      - name: Build
        # ⚠️ 必须和实际访问地址一致 —— canonical / sitemap / og:url 都从它派生。
        #    GitHub Pages 项目页的地址形如 https://<user>.github.io/<repo>。
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
